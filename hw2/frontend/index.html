<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4eff9" />
    <title>Pocket Flow — a little space for your tasks</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="desk-corner desk-corner--left" aria-hidden="true"></div>
    <div class="desk-corner desk-corner--right" aria-hidden="true"></div>
    <div class="side-note" aria-hidden="true">Good progress<br />today ♡</div>

    <main class="app-shell">
      <header class="app-header">
        <div class="brand">
          <h1><span class="brand-mark">Pocket Flow</span><span class="brand-spark" aria-hidden="true">✳</span></h1>
          <p>Small tasks. A calmer you.</p>
        </div>
        <button class="button button--primary" id="add-task" type="button"><span aria-hidden="true">＋</span> Add task</button>
      </header>

      <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>

      <section class="board" aria-label="Task board" id="board">
        <div class="lane lane--todo" data-status="todo">
          <header class="lane-header">
            <h2><span class="lane-label">To Do</span></h2>
            <span class="lane-count" id="todo-count" aria-label="0 tasks">0</span>
          </header>
          <div class="task-list" id="todo-list"></div>
        </div>

        <div class="lane lane--in-progress" data-status="in_progress">
          <header class="lane-header">
            <h2><span class="lane-label">In Progress</span></h2>
            <span class="lane-count" id="in-progress-count" aria-label="0 tasks">0</span>
          </header>
          <div class="task-list" id="in-progress-list"></div>
        </div>

        <div class="lane lane--done" data-status="done">
          <header class="lane-header">
            <h2><span class="lane-label">Done</span></h2>
            <span class="lane-count" id="done-count" aria-label="0 tasks">0</span>
          </header>
          <div class="task-list" id="done-list"></div>
        </div>
      </section>
      <p class="board-tip">Drag a note to another column, or use its <strong>Move to</strong> menu.</p>
    </main>

    <dialog id="task-dialog" class="task-dialog" aria-labelledby="dialog-heading">
      <form id="task-form" novalidate>
        <div class="dialog-topline"></div>
        <div class="dialog-heading-row">
          <div>
            <p class="dialog-eyebrow">A note to yourself</p>
            <h2 id="dialog-heading">Add a task</h2>
          </div>
          <button id="close-dialog" class="icon-button" type="button" aria-label="Close">×</button>
        </div>

        <label for="task-title">Task title <span class="required">*</span></label>
        <input id="task-title" name="title" type="text" maxlength="120" required placeholder="What needs doing?" />
        <p class="field-hint">Up to 120 characters.</p>

        <label for="task-notes">Notes <span class="optional">optional</span></label>
        <textarea id="task-notes" name="notes" maxlength="1000" rows="5" placeholder="A detail you want to remember…"></textarea>
        <p class="field-hint">Up to 1,000 characters.</p>

        <p id="form-error" class="form-error" role="alert" hidden></p>

        <div id="delete-confirm" class="delete-confirm" hidden>
          <p><strong>Delete this task?</strong> This note will be removed from the board.</p>
          <div class="confirm-actions">
            <button id="cancel-delete" class="button button--quiet" type="button">Keep task</button>
            <button id="confirm-delete" class="button button--danger" type="button">Delete task</button>
          </div>
        </div>

        <div id="dialog-actions" class="dialog-actions">
          <button id="delete-trigger" class="button button--text-danger" type="button" hidden>Delete task</button>
          <div class="dialog-actions-right">
            <button id="cancel-dialog" class="button button--quiet" type="button">Cancel</button>
            <button id="save-task" class="button button--primary" type="submit">Add task</button>
          </div>
        </div>
      </form>
    </dialog>

    <script type="module" src="/src/app.js"></script>
  </body>
</html>
